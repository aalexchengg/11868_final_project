# Config for single device full finetuning in full_finetune_single_device.py
# using a Qwen2.5 1.5B
#
# This config assumes that you've run the following command before launching:
#   tune download Qwen/Qwen2.5-1.5B --output-dir /tmp/Qwen2_5-1_5B-Base
#
# To launch on a single device, run the following command from root:
#   tune run full_finetune_single_device --config qwen2_5/1.5B_full_single_device
#
# You can add specific overrides through the command line. For example
# to override the checkpointer directory while launching training:
#   tune run full_finetune_single_device --config qwen2_5/1.5B_full_single_device checkpointer.checkpoint_dir=<YOUR_CHECKPOINT_DIR>
#
# This config works only for training on single device.


output_dir: /local/torchtune/qwen2_5_1_5b/vanilla_single_device # /tmp may be deleted by your system. Change it to your preference.

# Model Arguments
model:
  _component_: torchtune.models.qwen2_5.qwen2_5_1_5b_base

tokenizer:
  _component_: torchtune.models.qwen2_5.qwen2_5_tokenizer
  path: /tmp/Qwen2_5-1_5B-Base/vocab.json
  merges_file: /tmp/Qwen2_5-1_5B-Base/merges.txt
  max_seq_len: 4096

checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: /tmp/Qwen2_5-1_5B-Base
  checkpoint_files: [model.safetensors]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: QWEN2

upload_final_checkpoint: True
upload_repo_name: 'qwen2-1.5b-vanilla-single-device'
resume_from_checkpoint: False

# Dataset and Sampler
# dataset:
#   _component_: torchtune.datasets.alpaca_cleaned_dataset
#   packed: True # True increases speed

dataset:
  # Use the custom builder function from the modified file
  _component_: custom_datasets.text_completion_dataset
  # source, column, split, add_eos etc are arguments to the builder function
  source: google/code_x_glue_cc_code_completion_token
  column: code
  add_eos: False
  split: train[:100%]
  packed: True # VERY IMPORTANT
  fim_prob: 0.5

seed: null
shuffle: True
batch_size: 8

# Optimizer and Scheduler
optimizer:
  _component_: torch.optim.AdamW
  fused: True
  weight_decay: 0.01
  lr: 2e-3
optimizer_in_bwd: False  # True saves memory. Requires gradient_accumulation_steps=1

lr_scheduler:
  _component_: torchtune.training.lr_schedulers.get_cosine_schedule_with_warmup
  num_warmup_steps: 100

loss:
  _component_: torchtune.modules.loss.CEWithChunkedOutputLoss

# Training
epochs: 10
max_steps_per_epoch: null
gradient_accumulation_steps: 32 # Use to increase effective batch size
clip_grad_norm: 1
compile: True # torch.compile the model + loss, True increases speed + decreases memory

# Logging
metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: ./logs/vanilla_1_5B
log_every_n_steps: 1
log_peak_memory_stats: True

# Environment
device: cuda
# NOTE - set to 'fp32' instead of bf16 because running on RTX 2070 on Jackson's Desktop - Change on PSC
dtype: bf16

# Activations Memory - leave on for 2070
enable_activation_checkpointing: False # True reduces memory a lot, medium perf impact
enable_activation_offloading: False # True reduces memory a bit, small perf impact

# Show case the usage of pytorch profiler
# Set enabled to False as it's only needed for debugging training
profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: False

  #Output directory of trace artifacts
  output_dir: ${output_dir}/profiling_outputs

  #`torch.profiler.ProfilerActivity` types to trace
  cpu: True
  cuda: True

  #trace options passed to `torch.profiler.profile`
  profile_memory: True
  with_stack: False
  record_shapes: True
  with_flops: False

  # `torch.profiler.schedule` options:
  # wait_steps -> wait, warmup_steps -> warmup, active_steps -> active, num_cycles -> repeat
  wait_steps: 5
  warmup_steps: 5
  active_steps: 2
  num_cycles: 1
